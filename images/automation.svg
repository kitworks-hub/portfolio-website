<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="AI automation workflow illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112b"/><stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset=".55" stop-color="#00d4ff"/><stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <style>
      .flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -12; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 50% { transform: scale(1.12); } }
    </style>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <!-- connecting lines -->
  <g fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" class="flow">
    <path d="M78 85 H150"/><path d="M250 85 H322"/>
    <path d="M200 56 V30 H322 V58" opacity=".6"/>
    <path d="M200 114 V140 H78 V112" opacity=".6"/>
  </g>
  <!-- trigger -->
  <rect x="38" y="58" width="56" height="54" rx="14" fill="#1b1838" stroke="#7c5cff" stroke-width="2"/>
  <path d="M68 70 l-12 20 h10 l-4 16 l14 -22 h-10 z" fill="#ffd166"/>
  <!-- AI core -->
  <g class="pulse">
    <circle cx="200" cy="85" r="36" fill="#101a33" stroke="url(#g)" stroke-width="3"/>
    <circle cx="200" cy="85" r="24" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="200" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#fff">AI</text>
  </g>
  <!-- action -->
  <rect x="306" y="58" width="56" height="54" rx="14" fill="#1b1838" stroke="#00d4ff" stroke-width="2"/>
  <path d="M322 86 l10 10 l20 -22" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-6 0)"/>
  <!-- small side nodes -->
  <circle cx="322" cy="30" r="7" fill="#ff4fd8"/><circle cx="78" cy="140" r="7" fill="#7c5cff"/>
</svg>
